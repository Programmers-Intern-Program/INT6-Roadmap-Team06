spring:
  application:
    name: coach-backend
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 3s
  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-key-change-in-production-f8e7d6c5b4a39281706958473625140a}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 86400
  cookie:
    secure: false
  oauth2:
    frontend-redirect-url: ${FRONTEND_URL:http://localhost:3000}
  access-token-encryption:
    # AES-256 key, Base64 인코딩된 정확히 32 바이트. 운영 환경은 반드시 env 로 주입.
    # 로컬은 application-secret.yml 또는 .env 에서 ACCESS_TOKEN_ENCRYPTION_KEY 설정.
    # 미설정 시 앱 기동 실패 (fail-fast).
    key: ${ACCESS_TOKEN_ENCRYPTION_KEY:}

ai:
  gateway:
    api-key: ${AI_GATEWAY_API_KEY:}
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:0}
    model: ${AI_GATEWAY_MODEL:default}
    timeout:
      connect: 5s
      read: 120s
    retry:
      # 기본 1회 = 재시도 없음 (안전 기본). 운영에서 활성화하려면 env 로 오버라이드.
      # 화이트리스트(LLM_INVALID_RESPONSE / ANALYSIS_FAILED) 에 한해 적용. 자세한 정책은 AiGatewayLlmClient 참고.
      max-attempts: ${AI_GATEWAY_RETRY_MAX_ATTEMPTS:1}
      backoff: ${AI_GATEWAY_RETRY_BACKOFF:200ms}
  concurrency:
    max-concurrent-calls: 4
    queue-timeout-seconds: 180

roadmap:
  max-weeks: 8

coach:
  async:
    analysis:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
      thread-name-prefix: analysis-task-
    parallel-analysis:
      core-pool-size: 2
      max-pool-size: 2
      queue-capacity: 20
      thread-name-prefix: parallel-analysis-

github:
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    oauth-base-url: ${GITHUB_OAUTH_BASE_URL:https://github.com}
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    connection-client-id: ${GITHUB_CONNECTION_CLIENT_ID:${GITHUB_CLIENT_ID:}}
    connection-client-secret: ${GITHUB_CONNECTION_CLIENT_SECRET:${GITHUB_CLIENT_SECRET:}}

springdoc:
  swagger-ui:
    url: /openapi.yml

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.resource.jdbc: WARN
    com.back.coach.domain.github.service: DEBUG
    com.back.coach.domain.github.service.triage: DEBUG
    com.back.coach.external.llm: DEBUG
    com.back.coach.external.github: WARN
