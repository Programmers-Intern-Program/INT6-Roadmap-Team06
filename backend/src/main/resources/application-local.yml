spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/coachdb}
    username: ${DATABASE_USERNAME:coach}
    password: ${DATABASE_PASSWORD:coach}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  gateway:
    timeout:
      read: 300s  # 로컬 LLM 응답 지연 대비 길게 유지
    retry:
      # 로컬에서 retry 발동을 눈으로 확인하려면 scripts/dev/llm-stub-server.py 와 함께 사용.
      # 운영 기본값은 application.yml 의 max-attempts: 1 (재시도 없음).
      max-attempts: ${AI_GATEWAY_RETRY_MAX_ATTEMPTS:3}
      backoff: ${AI_GATEWAY_RETRY_BACKOFF:300ms}

logging:
  level:
    com.back.coach: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web.authentication: DEBUG
