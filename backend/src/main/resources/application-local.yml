spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/coachdb}
    username: ${DATABASE_USERNAME:coach}
    password: ${DATABASE_PASSWORD:coach}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    access-ttl-seconds: 86400  # smoke 전용 24시간 — 프로덕션 복원 필요 (기본값 900)

ai:
  gateway:
    timeout:
      read: 300s  # smoke 전용 5분 — 프로덕션 복원 필요 (기본값 120s)

logging:
  level:
    com.back.coach: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web.authentication: DEBUG
